<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="./streamlit-component-lib.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  body { background: transparent; overflow: hidden; padding: 0; margin: 0; }
  .paste-container {
    display: flex;
    flex-direction: column;
    width: 100%;
    height: 100%;
  }
  .paste-box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 98.4px;
    background-color: #f8fafc;
    border: 1px dashed #94a3b8;
    border-radius: 8px;
    cursor: pointer;
    padding: 10px 14px;
    text-align: center;
    transition: all 0.2s ease;
    outline: none;
    user-select: none;
    box-sizing: border-box;
  }
  .paste-box:hover {
    border-color: #2563eb;
    background-color: #eff6ff;
  }
  .paste-box:focus {
    border-color: #2563eb;
    border-style: solid;
    box-shadow: 0 0 0 2px rgba(37, 99, 235, 0.2);
    background-color: #eff6ff;
  }
  .paste-box.flash-success {
    border-color: #16a34a !important;
    background-color: #f0fdf4 !important;
  }
  .paste-text-container {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    gap: 6px;
  }
  .paste-title {
    font-size: 0.88rem;
    font-weight: 500;
    color: #334155;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    line-height: 1.2;
  }
  .icon {
    font-size: 1.05rem;
  }
  .paste-subtitle {
    font-size: 0.80rem;
    font-weight: 400;
    color: #64748b;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    line-height: 1.2;
  }
  .kbd {
    display: inline-block;
    padding: 2px 6px;
    font-size: 0.74rem;
    font-family: monospace;
    background: #e2e8f0;
    border-radius: 4px;
    border: 1px solid #cbd5e1;
    color: #1e293b;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="paste-container">
    <div class="paste-box" id="pasteBox" tabindex="0" title="Haz clic o presiona Ctrl + V para pegar capturas de pantalla">
      <div class="paste-text-container">
        <div class="paste-title">
          <span class="icon">📋</span> Copia tus screenshots aquí:
        </div>
        <div class="paste-subtitle">
          <span class="kbd">Ctrl + V</span> o clic izquierdo
        </div>
      </div>
    </div>
  </div>

<script>
function sendPastedImage(dataUrl) {
  const box = document.getElementById('pasteBox');
  if (box) {
    box.classList.add('flash-success');
    setTimeout(() => box.classList.remove('flash-success'), 600);
  }
  Streamlit.setComponentValue({
    dataUrl: dataUrl,
    timestamp: Date.now()
  });
}

function handlePasteBlob(blob) {
  if (!blob) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    sendPastedImage(e.target.result);
  };
  reader.readAsDataURL(blob);
}

// 1. Escuchar paste del teclado
window.addEventListener('paste', (e) => {
  const items = e.clipboardData ? e.clipboardData.items : [];
  for (let i = 0; i < items.length; i++) {
    if (items[i].type.indexOf('image') !== -1) {
      const blob = items[i].getAsFile();
      handlePasteBlob(blob);
      e.preventDefault();
      return;
    }
  }
});

// 2. Clic directo en el área: lee del portapapeles si tiene permisos
const box = document.getElementById('pasteBox');
box.addEventListener('click', async () => {
  box.focus();
  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      const items = await navigator.clipboard.read();
      for (const item of items) {
        if (item.types.includes('image/png')) {
          const blob = await item.getType('image/png');
          handlePasteBlob(blob);
          return;
        } else if (item.types.includes('image/jpeg')) {
          const blob = await item.getType('image/jpeg');
          handlePasteBlob(blob);
          return;
        }
      }
    }
  } catch (err) {
    console.log("Clipboard fallback to Ctrl+V:", err);
  }
});

// Inicialización de Streamlit
Streamlit.events.addEventListener(Streamlit.RENDER_EVENT, function(event) {
  Streamlit.setFrameHeight(98.4);
});
Streamlit.setComponentReady();
Streamlit.setFrameHeight(98.4);
</script>
</body>
</html>
